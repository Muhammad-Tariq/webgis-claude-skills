name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${TAG_NAME}" == *-* ]]; then
            gh release create "${TAG_NAME}" \
              --repo "${{ github.repository }}" \
              --title "${TAG_NAME}" \
              --generate-notes \
              --prerelease \
              --verify-tag
          else
            gh release create "${TAG_NAME}" \
              --repo "${{ github.repository }}" \
              --title "${TAG_NAME}" \
              --generate-notes \
              --verify-tag
          fi
