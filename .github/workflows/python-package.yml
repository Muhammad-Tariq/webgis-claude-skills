name: Python package

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  package:
    name: Python package validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Install wheel
        run: |
          python -m pip install dist/*.whl
          webgis-claude-skills version
      - name: Run Python CLI smoke test
        run: python test/python-cli-smoke.py
