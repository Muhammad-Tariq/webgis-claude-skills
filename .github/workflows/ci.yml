name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python and repository quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python sources
        run: python -m compileall -q evals

      - name: Validate evaluation contracts
        run: |
          python evals/runner.py --output evals/ci-results.json

      - name: Run deterministic adapter smoke suite
        run: python evals/ci_smoke.py

      - name: Upload evaluation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: evals/ci-results.json
          if-no-files-found: warn
