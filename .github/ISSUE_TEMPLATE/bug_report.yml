name: Bug report
description: Report a reproducible problem in WebGIS Claude Skills
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
      placeholder: Describe the issue clearly.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reproducible example, command, or evaluation case.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation / environment
      description: Include relevant Python version, GIS runtime, OS, and exact checks when applicable.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and security
      options:
        - label: I have removed secrets, credentials, private data, proprietary datasets, and sensitive coordinates.
          required: true
