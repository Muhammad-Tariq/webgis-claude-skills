<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560"><rect width="1400" height="560" rx="28" fill="#081421"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="700" y="65" fill="white" font-size="34" font-weight="700">Scientific Integrity Gate</text><text x="700" y="98" fill="#94a3b8" font-size="18">Metrics are evidence — not permission to manipulate methodology</text><g fill="#0d2236" stroke="#38bdf8" stroke-width="2"><rect x="90" y="180" width="250" height="120" rx="18"/><rect x="425" y="180" width="250" height="120" rx="18"/><rect x="760" y="180" width="250" height="120" rx="18"/><rect x="1095" y="180" width="215" height="120" rx="18"/></g><g fill="white" font-size="20" font-weight="700"><text x="215" y="220">EXPERIMENT</text><text x="550" y="220">VALIDITY</text><text x="885" y="220">METRICS</text><text x="1202" y="220">DECISION</text></g><g fill="#94a3b8" font-size="15"><text x="215" y="250">data • split • model</text><text x="550" y="250">leakage • bias • protocol</text><text x="885" y="250">F1 • IoU • RMSE • AUC</text><text x="1202" y="250">accept • reject • escalate</text></g><path d="M340 240H425M675 240H760M1010 240H1095" stroke="#38bdf8" stroke-width="4"/><rect x="250" y="380" width="900" height="90" rx="20" fill="#160f1d" stroke="#f472b6" stroke-width="2"/><text x="700" y="418" fill="#fbcfe8" font-size="20" font-weight="700">FORBIDDEN</text><text x="700" y="448" fill="#f1f5f9" font-size="17">Change the scientific protocol solely because it produces a higher score.</text></g></svg>