[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "webgis-claude-skills"
version = "0.1.0"
description = "WebGIS, GIS, GeoAI and spatial engineering skills plus Python GIS runtime extras."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Tariq Azam" }]
keywords = ["webgis", "gis", "geoai", "gdal", "geopandas", "remote-sensing"]
dependencies = []

[project.optional-dependencies]
gis = [
  "numpy>=1.26",
  "pandas>=2",
  "shapely>=2",
  "pyproj>=3.6",
  "geopandas>=1.0",
  "rasterio>=1.4"
]
gdal = [
  "GDAL>=3.8"
]
remote-sensing = [
  "earthengine-api>=1.6"
]

[project.urls]
Homepage = "https://github.com/Muhammad-Tariq/webgis-claude-skills"
Repository = "https://github.com/Muhammad-Tariq/webgis-claude-skills.git"
